  # Pin to the version our patch (patches/@ai-sdk__anthropic.patch) targets so every
  # instance — including the copies pulled transitively by @ai-sdk/amazon-bedrock and
  # @ai-sdk/google-vertex — resolves to the single patched build. 3.0.87 backports
  # sanitizeJsonSchema; the patch wires it into tool input_schema (see the patch).
  '@ai-sdk/anthropic': '3.0.87'

  # --- security hardening: floor HIGH-severity runtime advisories (pnpm audit, 2026-06) ---
  # Keyed-range overrides only replace the vulnerable versions, preserving major-line APIs.
  'axios@<1.16.0': '1.18.1'
  '@xmldom/xmldom@<0.8.12': '0.8.13'
  '@xmldom/xmldom@>=0.9.0 <0.9.10': '0.9.10'
  'tar@>=7.0.0 <7.5.11': '7.5.19'
  # tar 6.2.1 (via canvas → @mapbox/node-pre-gyp) has no fixed 6.x release; only the 7.x line is
  # patched. node-pre-gyp's tar API usage is 7-compatible. Verified: install clean + harness green.
  'tar@6.2.1': '7.5.19'
  'hono@<4.12.25': '4.12.27'
  'fast-uri@>=3.0.0 <3.1.2': '3.1.2'
  '@hono/node-server@>=1.0.0 <1.19.13': '1.19.13'
  'express-rate-limit@>=8.2.0 <8.2.2': '8.2.2'
  'path-to-regexp@>=8.0.0 <8.4.0': '8.4.0'
  'lodash-es@<4.17.24': '4.18.1'
  'underscore@<1.13.8': '1.13.8'
  'ws@>=8.0.0 <8.21.0': '8.21.0'
  'form-data@>=4.0.0 <4.0.6': '4.0.6'
  # --- security hardening: floor MODERATE runtime advisories (pnpm audit, 2026-06) ---
  # Scoped to vulnerable major; skips file-type (16→21) and js-yaml (no secure 4.x) as unsafe major bumps.
  'dompurify@>=3.0.0 <3.4.7': '3.4.11'
  'mermaid@>=11.0.0 <11.14.1': '11.16.0'
  'ajv@>=8.0.0 <8.18.0': '8.20.0'
  'brace-expansion@>=1.0.0 <1.1.13': '1.1.13'
  'ip-address@>=10.0.0 <10.1.1': '10.1.1'
  'qs@>=6.11.1 <6.15.2': '6.15.3'
  'uuid@>=11.0.0 <11.1.1': '11.1.1'
  # NOTE: @anthropic-ai/sdk floor (0.91.1) intentionally NOT applied — it adds a required
  # `stop_details` field to Delta/Message that breaks src/main/.../AiSdkToAnthropicSse.ts typecheck.
  # That moderate advisory is left for an SDK bump that updates the adapter together.

